name: PHP SeedWork Docs

# Before the first deploy:
#   1. Create the gh-pages branch (or let mike create it on first run).
#   2. Enable GitHub Pages in Settings → Pages → Source: Deploy from branch gh-pages.

on:
  push:
    branches:
    - main
    paths:
    - docs/**
    - mkdocs.yml
  workflow_call:
    inputs:
      version:
        description: Version to deploy without leading v (e.g. 0.8.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version to deploy without leading v (e.g. 0.8.0)
        required: true
        type: string

permissions: {}

jobs:
  deploy:
    name: Deploy Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Configure git identity
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Determine version
      id: version
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
        else
          echo "value=$(python -m semantic_release version --print-last-released)" >> "$GITHUB_OUTPUT"
        fi

    - name: Deploy docs
      run: mike deploy --push --update-aliases ${{ steps.version.outputs.value }} latest

    - name: Set default version
      run: mike set-default --push latest
